spring:
  datasource:
    # MySQL 8.x JDBC 驱动类。
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 本地数据库连接地址，可以通过 MYSQL_URL 环境变量整体覆盖。
    url: jdbc:mysql://localhost:3306/cold_chain_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true

    # 本地数据库用户名，默认使用 root，也可以通过环境变量覆盖。
    username: root

    # 数据库密码不写入 GitHub，必须通过 MYSQL_PASSWORD 环境变量提供。
    password: 123456

  ai:
    tools:
      # Tool内部发生未处理的系统异常时向调用方抛出，避免模型把数据库或权限故障解释成正常业务结果。
      throw-exception-on-error: true

    # 明确指定当前项目使用 OpenAI 协议的 ChatModel 自动配置。
    model:
      chat: openai

    # 控制模型请求失败后的重试行为。
    retry:
      # 本地开发阶段最多尝试两次，避免错误配置导致长时间重复等待。
      max-attempts: 1

    openai:
      # OpenAI Compatible 服务地址，通过环境变量适配阿里云百炼或其他兼容平台。
      base-url: https://ws-cbifgwaicvmt6h8y.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

      # API Key 禁止直接写入配置文件，未配置时使用占位值保证项目能够启动。
      api-key: ${OPENAI_API_KEY}

      chat:
        # 实际模型名称通过环境变量提供，默认值只用于完成基础启动。
        model: qwen3-max

        # 较低温度让订单、支付和规则问答更加稳定，减少随机发挥。
        temperature: 0.2

      embedding:
        # RAG文本向量化模型。
        # PDF切片之后，每一个Document Chunk都会通过该模型转换成Embedding向量。
        model: text-embedding-v4

        # 每个Chunk最终生成1024维向量。
        # 这个值必须与后面PGVector表embedding字段的维度完全一致，
        # 否则写入向量数据库时会因为维度不匹配直接失败。
        dimensions: 1024

        # 要求Embedding接口返回浮点数向量。
        # PGVector最终存储的就是这一组浮点特征数据，而不是base64字符串。
        encoding-format: float


logging:
  level:
    # 项目自身代码默认输出 INFO 级别日志。
    com.ymm.coldchainai: INFO

    # 数据库验证 Mapper 使用 DEBUG，便于本地查看真实执行的 SQL。
    com.ymm.coldchainai.verification.infrastructure.persistence.mapper: DEBUG

    # 本地开发时输出Agent执行记录Mapper SQL，便于观察状态流转。
    com.ymm.coldchainai.agent.core.infrastructure.persistence.mapper: DEBUG

    # 输出冷运订单查询SQL和参数，便于本地验证租户、司机和成交时间范围。
    com.ymm.coldchainai.order.infrastructure.persistence.mapper: DEBUG

    # 输出冷运定金支付单查询SQL，便于观察租户隔离和最新支付单选择结果。
    com.ymm.coldchainai.payment.infrastructure.persistence.mapper: DEBUG

cold-chain-ai:
  security:
    local:
      # 本地开发环境模拟的已认证用户ID，不能由前端或模型覆盖。
      current-user-id: ${LOCAL_CURRENT_USER_ID:90001}

      # 本地开发环境模拟的已认证租户ID，与订单演示数据中的tenant_id保持一致。
      current-tenant-id: ${LOCAL_CURRENT_TENANT_ID:1001}

  rag:
    internal-rule:
      # 满帮内部规范PDF在classpath中的位置。
      resource-location: classpath:/rag/documents/mmb-internal-rules.pdf

      # 稳定文档编码，后续会写入VectorStore metadata，用于文档版本管理和过滤。
      document-code: mmb-internal-rules

      # 文档展示名称。
      document-name: 满帮集团内部规范文档

      # 当前文档版本。
      document-version: V1.0

      # PDF先按照物理页转换成Document，再继续进行Token切片。
      pages-per-document: 1

      # 每个Chunk目标Token数量。
      # 当前文档很短，使用180可以把考勤、资产、Git、事故规范拆得相对细一些。
      chunk-size: 180

      # 太短的文本块不单独形成知识Chunk，避免产生大量无意义碎片。
      min-chunk-size-chars: 60

      # 小于该字符长度的Chunk不进入后续Embedding流程。
      min-chunk-length-to-embed: 20

      # 单个文档允许生成的最大Chunk数量，防止异常PDF产生海量切片。
      max-num-chunks: 200

      # 切片时保留分隔符，尽量保留原文语义结构。
      keep-separator: true

      # ==================== 内部规范向量检索配置 ====================
      retrieval:
        # 第一阶段最多观察5个候选Chunk，方便比较每个候选结果的相似度Score。
        top-k: 5

        # 当前处于检索效果标定阶段，暂时不通过相似度阈值过滤结果。
        similarity-threshold: 0.0

    pgvector:
      # RAG专用阿里云RDS PostgreSQL地址。注意这里不是业务MySQL，也不是默认postgres数据库，
      # 最终JDBC URL必须明确连接cold_chain_ai_rag数据库。
      jdbc-url: jdbc:postgresql://rm-cn-zqx4vtv520001rbo.rwlb.rds.aliyuncs.com:5432/cold_chain_ai_rag

      # RAG PostgreSQL账号从IDEA环境变量读取。
      username: cold_chain_ai_rag_admin

      # 数据库密码属于敏感配置，只允许从环境变量读取，禁止写死到Git仓库。
      password: ${RAG_PGVECTOR_PASSWORD}

      # 当前使用PostgreSQL默认public Schema。
      schema-name: public

      # Spring AI后续创建的内部规范向量表名称。
      table-name: internal_rule_vector_store

      # PGVector embedding列维度。
      # 必须和text-embedding-v4实际返回的1024维完全一致。
      dimensions: 1024

      # 允许Spring AI首次构建VectorStore时初始化表结构和向量索引。
      # 你已经提前安装vector、hstore、uuid-ossp，所以扩展依赖已经准备完成。
      initialize-schema: true

      # text-embedding-v4的OpenAI兼容接口单次最多接收10条文本，
      # 因此这里把单批Document数量限制为10，避免后续文档增多后一次提交过多Chunk导致Embedding接口拒绝请求。
      max-document-batch-size: 10

  agent:
    chat-memory:
      # 单次发送给模型的最大历史消息数量。20条消息通常约等于10轮完整问答。
      max-messages: 20