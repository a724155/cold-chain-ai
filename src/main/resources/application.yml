spring:
  application:
    # 当前 Spring Boot 应用名称，后续日志、监控、链路追踪和服务注册都会使用该名称。
    name: cold-chain-ai

  profiles:
    # 默认启用 local 环境，也可以通过 SPRING_PROFILES_ACTIVE 环境变量覆盖。
    active: ${SPRING_PROFILES_ACTIVE:local}

  lifecycle:
    # 应用关闭时最多等待 30 秒，让正在处理的请求和任务尽量执行完成。
    timeout-per-shutdown-phase: 30s

server:
  # 默认使用 8080 端口，也可以通过 SERVER_PORT 环境变量覆盖。
  port: ${SERVER_PORT:8080}

  # 开启优雅停机，避免应用关闭时直接中断正在处理的 HTTP 请求。
  shutdown: graceful


mybatis:
  # 后续所有 MyBatis XML 文件统一放在 resources/mapper 的业务子目录中。
  mapper-locations: classpath*:mapper/**/*.xml

  configuration:
    # 将数据库下划线字段自动转换成 Java 驼峰属性，例如 order_no 映射为 orderNo。
    map-underscore-to-camel-case: true

    # SQL 执行日志通过 SLF4J 输出，避免直接使用 System.out 打印 SQL。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

    # 单条 SQL 的默认超时时间为 30 秒，避免异常 SQL 无限等待。
    default-statement-timeout: 5

logging:
  file:
    # 默认将运行日志写入项目根目录下的 logs，也可以通过 LOG_PATH 环境变量覆盖。
    path: ${LOG_PATH:logs}